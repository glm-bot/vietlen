name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu 26.04 runner khong con Python 3.9/3.10 — chi test cac ban con ho tro
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Chạy bộ test
        run: python -m unittest discover -s tests -v

      - name: Smoke test từng lệnh
        run: |
          python vietlen.py ngay
          echo "mo ta thu nghiem" > /tmp/ghi-chu.txt
          python vietlen.py dem /tmp/ghi-chu.txt
          python vietlen.py tim-dong thu /tmp/ghi-chu.txt
          cp /tmp/ghi-chu.txt /tmp/ghi-chu-2.txt
          python vietlen.py so-sanh /tmp/ghi-chu.txt /tmp/ghi-chu-2.txt
          python vietlen.py luu /tmp/ghi-chu.txt --vao /tmp/sao-luu
          mkdir -p /tmp/kho
          touch /tmp/kho/hinh.jpg
          echo "abc" > /tmp/kho/van-ban.txt
          python vietlen.py tim hinh --trong /tmp/kho
          python vietlen.py kich-thuoc /tmp/kho
          mkdir -p /tmp/dep
          echo "x" > /tmp/dep/chuong.pyc
          mkdir -p /tmp/dep/__pycache__
          touch /tmp/dep/__pycache__/mod.cpython-311.pyc
          touch /tmp/dep/.DS_Store
          python vietlen.py don-dep /tmp/dep
          python vietlen.py don-dep /tmp/dep --xoa
          python vietlen.py doi-ten /tmp/kho --cu van-ban --moi ghi-chu
          python vietlen.py doi-ten /tmp/kho --cu van-ban --moi ghi-chu --thuc-su

      - name: Kiểm tra cài đặt pip (pyproject.toml)
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          vietlen ngay
          vietlen dem README.md
